[project]
name = "vertex-benchmark"
version = "0.1.0"
description = "Vertex AI Performance Benchmarking"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "google-cloud-aiplatform",
    "streamlit",
    "pandas",
    "matplotlib",
    "seaborn",
    "reportlab",
    "fpdf",
]
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.setuptools]
package-dir = {"" = "src"}

